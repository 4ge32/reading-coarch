name: ReadingCoach
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    READINGCOACH_BUNDLE_ID: com.example.ReadingCoach
    READINGCOACH_APP_GROUP: group.com.example.ReadingCoach
    READINGCOACH_APP_PROFILE: ''
    READINGCOACH_SHARE_PROFILE: ''
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: '1'
packages:
  ReadingCore:
    path: ../packages/ReadingCore
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 156.0.0
targets:
  ReadingCoach:
    type: application
    platform: iOS
    sources:
      - path: ReadingCoach
      - path: Shared
    dependencies:
      - package: ReadingCore
      - package: WebRTC
      - target: ReadingCoachShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(READINGCOACH_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(READINGCOACH_APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ReadingCoach/ReadingCoach.entitlements
        GENERATE_INFOPLIST_FILE: false
    info:
      path: ReadingCoach/Info.plist
      properties:
        CFBundleDisplayName: ReadingCoach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 選んだ英文について音声で相談するためにマイクを使います。Liveでは音声を外部APIに送信します。
        ReadingCoachAppGroupIdentifier: $(READINGCOACH_APP_GROUP)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: ReadingCoach/ReadingCoach.entitlements
      properties:
        com.apple.security.application-groups:
          - $(READINGCOACH_APP_GROUP)
  ReadingCoachShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ReadingCoachShare
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(READINGCOACH_BUNDLE_ID).Share
        PROVISIONING_PROFILE_SPECIFIER: $(READINGCOACH_SHARE_PROFILE)
        INFOPLIST_FILE: ReadingCoachShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReadingCoachShare/ReadingCoachShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  ReadingCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ReadingCoachTests
    dependencies:
      - target: ReadingCoach
      - package: ReadingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(READINGCOACH_BUNDLE_ID).Tests
        GENERATE_INFOPLIST_FILE: true
  ReadingCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ReadingCoachUITests
    dependencies:
      - target: ReadingCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(READINGCOACH_BUNDLE_ID).UITests
        GENERATE_INFOPLIST_FILE: true
schemes:
  ReadingCoach:
    build:
      targets:
        ReadingCoach: all
        ReadingCoachShare: all
    test:
      gatherCoverageData: true
      targets:
        - ReadingCoachTests
        - ReadingCoachUITests
